<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestell App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/mealComponent.css" />
    <link rel="stylesheet" href="./styles/dialog.css" />
    <link rel="stylesheet" href="./styles/hover_styles.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <script src="./scripts/db.js"></script>
    <script src="script.js"></script>
  </head>
  <body onload="init()">
    <header>
      <div class="header_content">
        <div class="header_left_side">
          <img class="takeout_dining" src="./assets/icons/takeout_dining.svg" alt="Takeout Icon" />
          <p>Bestell<br /><span>App</span></p>
        </div>
      </div>
    </header>
    <main id="main">
      <section class="hero_section">
        <div class="hero_image">
          <img class="logo" src="./assets/img/Logo.png" alt="Logo des Bürgerladens" />
        </div>
      </section>
      <section class="headline">
        <div>
          <div class="reviews_counter">
            <img src="./assets/icons/star.svg" alt="Ein schwarzer Stern" />
            <div class="reviews_numbers">
              <span>4,1</span>
              <p>(317)</p>
            </div>
          </div>
          <h1><span>Burger</span>House</h1>
        </div>
        <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
      </section>
    </main>
    <dialog onclick="closeModal()" id="basketDialog">
      <div onclick="event.stopPropagation()" class="dialog_wrapper">
        <button onclick="closeModal()" class="close_button">
          <img src="./assets/icons/close.svg" alt="Ein X" />
        </button>
        <h2>Your Basket</h2>
        <ul>
          <li>
            <h3>1x Veggie mushroom black burger</h3>
            <div>
              <div class="meal_count_wrapper">
                <button>
                  <img src="./assets/icons/delete.svg" alt="eine Mülltonne" />
                </button>
                <p>1</p>
                <button>+</button>
              </div>
              <p>16,90€</p>
            </div>
          </li>
        </ul>
        <section class="summary">
          <div>
            <p>Subtotal</p>
            <p>36,70 €</p>
          </div>
          <div>
            <p>Delivery fee</p>
            <p>4,99 €</p>
          </div>
          <hr />
          <div>
            <p>Toal</p>
            <p>41,69 €</p>
          </div>
          <button>Buy now (41,69€)</button>
        </section>
      </div>
    </dialog>
    <footer>
      <div class="footer_wrapper">
        <p>Imprint</p>
        <p>Cookie Preferences</p>
        <div class="copyright">
          <img src="./assets/icons/copyright.svg" alt="copyright Icon" />
          <p>2025 BurgerHouse</p>
        </div>
      </div>
    </footer>

    <nav class="mobile_controls">
      <button onmouseover="changeButtonImg(this)" onmouseout="resetIcon(this)">
        <img src="./assets/icons/home.svg" alt="icon from a house" />
      </button>
      <button onmouseover="changeButtonImg(this)" onmouseout="resetIcon(this)">
        <img src="./assets/icons/person.svg" alt="Person Icon" />
      </button>
      <button onmouseover="changeButtonImg(this)" onmouseout="resetIcon(this)">
        <img src="./assets/icons/takeout_dining_2.svg" alt="takeout dining icon" />
      </button>
      <div class="shopping_car_wrapper">
        <p>3</p>
        <button onclick="openModal()">
          <img src="./assets/icons/shopping_cart.svg" alt="shopping car icon" />
        </button>
      </div>
    </nav>
  </body>
</html>
