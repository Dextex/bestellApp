<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestell App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/mealComponent.css" />
    <script src="./scripts/db.js"></script>
    <script src="script.js"></script>
  </head>
  <body onload="init()">
    <header>
      <div class="header_content">
        <div class="header_left_side">
          <img class="takeout_dining" src="./assets/icons/takeout_dining.svg" alt="Takeout Icon" />
          <p>Bestell<br /><span>App</span></p>
        </div>
      </div>
    </header>
    <main>
      <section class="hero_section">
        <div class="hero_image">
          <img class="logo" src="./assets/img/Logo.png" alt="Logo des Bürgerladens" />
        </div>
      </section>
      <section class="headline">
        <div>
          <div class="reviews_counter">
            <img src="./assets/icons/star.svg" alt="Ein schwarzer Stern" />
            <div class="reviews_numbers">
              <span>4,1</span>
              <p>(317)</p>
            </div>
          </div>
          <h1><span>Burger</span>House</h1>
        </div>
        <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
      </section>
      <section class="category_headline_section" id="categoryHeadline"></section>

      <section>
        <div class="meal_component">
          <div class="meal_information_container">
            <figure>
              <img
                src="./assets/img/veggie-mushdroom-black-burger.jpg"
                alt="Ein Veggie Bürger der Schwarz ist und aus Mushrooms gemacht ist"
              />
            </figure>

            <div class="meal_information">
              <h3>Veggie mushroom black burger</h3>
              <p>Chicken, Mozzarella, Gorgonzola, Fontina, Parmigiano Reggiano</p>
            </div>
          </div>
          <div class="pricing">
            <p>16,90€</p>
            <button>Add to basket</button>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
